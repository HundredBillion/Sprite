# Every reviewed finding, open or closed. This file is the definition of
# "closed": scripts/check_findings.py requires a resolved finding to name the
# test that guards it and an open or deferred finding to name its GitHub
# issue, and refuses any SPR/BCA/GAP-C ID that appears under docs/ without an
# entry here. The audit documents under docs/reviews keep the narrative;
# status lives only here.
#
# Fields: id, title, status (open | resolved | deferred | wontfix), source;
# test + fixed_by when resolved; issue when open or deferred; reason when
# wontfix. `test` is a Rust fn under crates/ or a Python test under scripts/.

