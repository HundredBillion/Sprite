# What Sprite promises a person using it, and the tests that hold each promise.
#
# scripts/check_capabilities.py fails CI when a kept capability names no test
# that exists, when an area has no kept capability left, or when a capability
# present on the base branch is missing here. So a behavior on this list cannot
# be removed or inverted by renaming its test: the change has to edit this file,
# where a reviewer sees it. To stop keeping a promise, set status = "retired"
# and give the reason and the decision (an ADR or issue); do not delete the
# entry. ADR 0038 has the reasoning.
#
# This list is seeded from existing tests, by area. It is not a claim that
# every behavior is covered; add an entry whenever a behavior someone relies
# on gets a test.
#
# Fields: id (<area>.<name>), area, promise, status (kept | retired), tests
# (Rust test fns under crates/ or Python tests under scripts/); reason and
# decision when retired.

areas = [
    "links",
    "clipboard",
    "selection",
    "paste",
    "mouse",
    "history",
    "colours",
    "session",
    "keys",
    "tabs-and-panes",
    "pane-control",
    "configuration",
    "images",
    "drawing",
    "command-line",
]

[[capability]]
id = "links.visible-url-opens"
area = "links"
promise = "Clicking a visible http:// or https:// URL opens it, once per click."
status = "kept"
tests = [
    "a_visible_url_resolves_without_osc8_metadata",
    "only_the_displayed_url_opens_once_for_each_intentional_click",
]

[[capability]]
id = "links.titled-label-opens"
area = "links"
promise = "Clicking a titled link whose address is not shown on its row opens its target, once per click (ADR 0037)."
status = "kept"
tests = [
    "a_titled_link_with_no_visible_address_resolves_to_its_target",
    "a_titled_link_with_no_visible_address_opens_once_for_each_click",
]

[[capability]]
id = "links.visible-url-wins"
area = "links"
promise = "Hidden OSC 8 metadata never changes where a visible URL leads, and linked text that shows a URL offers only that URL."
status = "kept"
tests = [
    "a_visible_url_does_not_inherit_the_hidden_osc8_target",
    "a_label_that_shows_a_url_cannot_send_the_click_elsewhere",
]

