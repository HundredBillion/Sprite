<?xml version="1.0" encoding="UTF-8"?>
<!--
  Sprite's icon: a prompt and a cursor, which is the whole of what a terminal
  looks like from across a room. Deliberately two shapes and two colours — an
  icon is read at 22 pixels in a task bar far more often than at 128.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <rect x="6" y="6" width="116" height="116" rx="26" fill="#16161e"/>
  <rect x="6" y="6" width="116" height="116" rx="26" fill="none" stroke="#2b2b3a" stroke-width="3"/>
  <path d="M 38 44 L 60 64 L 38 84" fill="none" stroke="#7fd8c0" stroke-width="11"
        stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="70" y="74" width="26" height="10" rx="3" fill="#7fd8c0"/>
</svg>
