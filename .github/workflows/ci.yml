name: ci

# Hosted CI is compile and headless coverage only. The native Wayland, X11, and
# interactive real-macOS gates in the TSP remain required: a headless
# compositor or an emulated display is not equivalent to the real thing.

on:
  push:
    branches: [master]
  pull_request:
  schedule:
    # Recheck native builds and tests against changes in hosted runner images.
    - cron: "17 4 * * *"
  workflow_dispatch:
    inputs:
      stress:
        description: Run the loaded issue acceptance loops and retain their logs
        type: boolean
        default: false

permissions:
  contents: read

env:
  RUST_VERSION: "1.98.1"
  # Zig comes from ziglang.org, checked against these digests, rather than
  # from a package manager: Homebrew and Arch move to a new Zig on their own
  # schedule, and Ghostty's build accepts exactly one minor version.
  ZIG_VERSION: "0.17.0"
  ZIG_SHA256_X86_64_LINUX: "1cbe9df9f27e6b78d14ccbca43b6703a404ef79ef1c463de901d7f088d4e2026"
  ZIG_SHA256_AARCH64_MACOS: "b607e9b9234790a008116ae5bdb71c6243b84b9fb42a53a9e70fde41c06c536a"
  GHOSTTY_COMMIT: "5064b3265e500d55f5f44ff48ca59b8685543bb8"
  # File and line numbers only, which is all a CI panic backtrace uses. Full
  # debug info makes every compile and link slower for a debugger nobody runs
  # on a hosted runner. Local builds are unaffected: they don't set this.
  CARGO_PROFILE_DEV_DEBUG: line-tables-only

jobs:
  release-automation:
    name: release version automation
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Install shell integration test dependencies
        run: sudo apt-get update && sudo apt-get install -y fish zsh
      - name: Test release, packaging and optional shell integration
        run: python3 -m unittest scripts.test_release_automation scripts.test_packaging_automation scripts.test_shell_integration scripts.test_ci_policy scripts.test_findings scripts.test_stress_tests -v

  arch:
    name: arch linux
    runs-on: ubuntu-latest
    # About twice the longest recent successful run (11.8 min), so a hang
    # fails in minutes instead of holding the runner for six hours.
    timeout-minutes: ${{ inputs.stress && 360 || 25 }}
    container:
      # Pinned by digest: a moving tag would silently change the toolchain
      # underneath a build whose whole point is reproducibility.
      image: archlinux@sha256:714acd1eef9ae997d95691b1c5220ada0076185b77857c1813f02de0fa83cf7b
    env:
      # A starved hosted runner can leave a worker silent for longer than the
      # five-second default without anything being stuck.
      SPRITE_TEST_WATCHDOG_SECS: "20"
    steps:
      - name: Install native build dependencies
        run: |
          set -euo pipefail
          pacman -Syu --noconfirm --needed \
            base-devel git curl ncurses python \
            less tmux \
            wayland libxkbcommon libx11 libxcb libxkbcommon-x11 \
            mesa vulkan-icd-loader vulkan-headers \
            fontconfig freetype2 openssl alsa-lib
          tic -V

      - name: Install the exact Zig
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 -sSfL -o /tmp/zig.tar.xz \
            "https://ziglang.org/download/${ZIG_VERSION}/zig-x86_64-linux-${ZIG_VERSION}.tar.xz"
          echo "${ZIG_SHA256_X86_64_LINUX}  /tmp/zig.tar.xz" | sha256sum -c -
          mkdir -p "$HOME/zig"
          tar -xJf /tmp/zig.tar.xz -C "$HOME/zig" --strip-components=1
          echo "$HOME/zig" >> "$GITHUB_PATH"
          "$HOME/zig/zig" version | grep -qx "${ZIG_VERSION}"

      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          submodules: recursive

      - name: Verify the pinned Ghostty commit
        run: |
          set -euo pipefail
          test "$(git -C vendor/ghostty rev-parse HEAD)" = "${GHOSTTY_COMMIT}"

      - name: Install the exact Rust toolchain
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
            | sh -s -- -y --profile minimal --default-toolchain "${RUST_VERSION}" \
              --component clippy --component rustfmt
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      # Compiled third-party crates and Ghostty's Zig cache are restored from
      # the last master run, so a change to Sprite recompiles only Sprite and
      # fetches no Zig package. The Zig cache also holds Ghostty's compiled
      # build script, which Zig otherwise rebuilds (about 100 s) before it can
      # even check its packages. The nightly run skips both caches to keep one
      # clean build a day against the current runner image.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        if: github.event_name != 'schedule'
        with:
          # Key on the pinned toolchain only. The default also hashes every
          # toolchain on the runner, including the stable Rust GitHub
          # preinstalls on macOS, which differs between the image versions
          # GitHub runs side by side, so the cache was missed at random.
          add-rust-environment-hash-key: "false"
          key: rust-${{ env.RUST_VERSION }}
          cache-bin: "false"
          save-if: ${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' }}

      # A separate cache because rust-cache empties every non-Cargo directory
      # under target/ before it saves. Its save runs as a post step, after the
      # explicit save below.
      - name: Restore Ghostty's Zig cache
        id: zig-cache
        if: github.event_name != 'schedule'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: target/zig-global-cache
          key: zig-cache-${{ runner.os }}-${{ env.ZIG_VERSION }}-${{ env.GHOSTTY_COMMIT }}

      - name: Fetch dependencies (the only network-enabled build stage)
        # Normally under three minutes. A stalled package host once held this
        # step for 23 minutes before failing.
        timeout-minutes: 10
        run: |
          set -euo pipefail
          python3 scripts/check_gpui_patch.py --fetch
          cargo fetch --locked
          export ZIG_GLOBAL_CACHE_DIR="$PWD/target/zig-global-cache"
          export ZIG_LOCAL_CACHE_DIR="$PWD/target/zig-local-cache"
          # `--fetch=all` is required: plain `--fetch` leaves the lazily
          # resolved packages (notably aro) unfetched, and the Cargo build
          # script then reaches the network during the offline gate below.
          (cd vendor/ghostty && zig build --fetch=all \
            -Demit-lib-vt=true -Demit-xcframework=false -Dapp-runtime=none)

      - name: Generate terminfo from the pinned source
        run: |
          set -euo pipefail
          export ZIG_GLOBAL_CACHE_DIR="$PWD/target/zig-global-cache"
          export ZIG_LOCAL_CACHE_DIR="$PWD/target/zig-local-cache"
          mkdir -p target/terminfo
          zig build-exe -lc -femit-bin=target/gen-terminfo \
            --dep ghostty_terminfo \
            -Mroot=scripts/gen-terminfo.zig \
            -Mghostty_terminfo=vendor/ghostty/src/terminfo/ghostty.zig
          ./target/gen-terminfo > target/ghostty.terminfo
          tic -x -o target/terminfo target/ghostty.terminfo
          infocmp -A target/terminfo xterm-ghostty > /dev/null

      # This container runs as root, and ncurses built with
      # --disable-root-environ ignores $TERMINFO for privileged processes. That
      # is why the identity test's `infocmp xterm-ghostty` fails here while
      # `infocmp -A <dir>` on the same database succeeds. The step below proves
      # it by repeating the lookup as an unprivileged user.
      - name: Diagnose terminfo resolution
        continue-on-error: true
        run: |
          set -x
          id -u
          TERMINFO="$PWD/target/terminfo" infocmp xterm-ghostty > /dev/null \
            && echo "root + TERMINFO env: OK" || echo "root + TERMINFO env: FAILED"
          chmod -R a+rX "$PWD/target/terminfo"
          setpriv --reuid=65534 --regid=65534 --clear-groups \
            env TERMINFO="$PWD/target/terminfo" infocmp xterm-ghostty > /dev/null \
            && echo "nonroot + TERMINFO env: OK" || echo "nonroot + TERMINFO env: FAILED"

      # Sprite sets TERMINFO for its children, which is correct and works for
      # ordinary users. It cannot work for a root process, so the container gets
      # the same generated entry installed system-wide instead. The entry is
      # still the one built from the pinned Ghostty source.
      - name: Install the generated terminfo system-wide (root container only)
        run: |
          set -euo pipefail
          tic -x target/ghostty.terminfo
          infocmp xterm-ghostty > /dev/null

      - name: Offline locked gate
        run: |
          set -euo pipefail
          cargo fmt --all -- --check
          rustfmt --edition 2024 --check vendor/gpui/src/platform/key_text_scope.rs
          python3 -m unittest scripts.test_gpui_patch -v
          cargo clippy --workspace --all-targets --locked --offline -- -D warnings
          # `--no-fail-fast`: without it cargo stops at the first failing test
          # binary, so a run reports one failure and silently skips the rest of
          # the suite. That is how the suite stayed red across eight merges — the
          # 2026-09-05 run reached only 6 of 33 binaries, and each fix revealed
          # the next latent failure instead of the whole set at once.
          cargo test --workspace --locked --offline --no-fail-fast
          cargo build --workspace --locked --offline
          cargo tree --locked --offline --duplicates
          cargo tree --locked --offline --edges features

      - name: Save Ghostty's Zig cache
        if: >-
          (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
          && steps.zig-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: target/zig-global-cache
          key: ${{ steps.zig-cache.outputs.cache-primary-key }}

      - name: Stress native Linux under CPU load
        if: ${{ !cancelled() && inputs.stress }}
        run: |
          set -uo pipefail
          test "$(uname -m)" = x86_64 || exit 1
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          failed=0
          for target in client app graphics_policy graphics_tmux; do
            python3 scripts/stress_tests.py "$target" --runs 100 --output "$RUNNER_TEMP/stress/$target" || failed=1
          done
          exit "$failed"

      - name: Retain stress evidence
        if: ${{ always() && inputs.stress }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: stress-linux
          path: ${{ runner.temp }}/stress/

      - name: Forbidden states
        run: |
          set -euo pipefail
          ! grep -rnE "unsafe impl.*(Send|Sync)|gpui[-_]ghostty|tty7|tokio|async_std|smol|crossbeam" \
            --include='*.rs' --include='Cargo.toml' crates || exit 1
          # Dependence, not prose. The earlier form matched the word anywhere,
          # including in comments explaining why the application does not use
          # these — so the gate failed on the documentation of the rule it
          # exists to enforce.
          ! grep -rnE "^[[:space:]]*use[[:space:]]+(libghostty_vt|portable_pty)|(libghostty_vt|portable_pty)::" \
            --include='*.rs' crates/sprite-app || exit 1
          ! grep -nE "^(libghostty-vt|portable-pty)[[:space:]]*=" crates/sprite-app/Cargo.toml || exit 1

  macos:
    name: macos
    runs-on: macos-latest
    # About twice the longest recent successful run (17.8 min).
    timeout-minutes: ${{ inputs.stress && 360 || 40 }}
    steps:
      - name: Record the runner image
        run: |
          set -euo pipefail
          sw_vers
          echo "ImageOS=${ImageOS:-unknown} ImageVersion=${ImageVersion:-unknown}"
          uname -m

      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          submodules: recursive

      - name: Verify the pinned Ghostty commit
        run: test "$(git -C vendor/ghostty rev-parse HEAD)" = "${GHOSTTY_COMMIT}"

      - name: Install exact toolchains
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
            | sh -s -- -y --profile minimal --default-toolchain "${RUST_VERSION}" \
              --component clippy --component rustfmt
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          curl --proto '=https' --tlsv1.2 -sSfL -o "$RUNNER_TEMP/zig.tar.xz" \
            "https://ziglang.org/download/${ZIG_VERSION}/zig-aarch64-macos-${ZIG_VERSION}.tar.xz"
          echo "${ZIG_SHA256_AARCH64_MACOS}  $RUNNER_TEMP/zig.tar.xz" | shasum -a 256 -c -
          mkdir -p "$HOME/zig"
          tar -xJf "$RUNNER_TEMP/zig.tar.xz" -C "$HOME/zig" --strip-components=1
          echo "$HOME/zig" >> "$GITHUB_PATH"
          "$HOME/zig/zig" version | grep -qx "${ZIG_VERSION}"

      # The same two caches as the Arch job, for the same reasons.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        if: github.event_name != 'schedule'
        with:
          add-rust-environment-hash-key: "false"
          key: rust-${{ env.RUST_VERSION }}
          cache-bin: "false"
          save-if: ${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' }}

      - name: Restore Ghostty's Zig cache
        id: zig-cache
        if: github.event_name != 'schedule'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: target/zig-global-cache
          key: zig-cache-${{ runner.os }}-${{ env.ZIG_VERSION }}-${{ env.GHOSTTY_COMMIT }}

      - name: Fetch dependencies (the only network-enabled build stage)
        timeout-minutes: 10
        run: |
          set -euo pipefail
          python3 scripts/check_gpui_patch.py --fetch
          cargo fetch --locked
          export ZIG_GLOBAL_CACHE_DIR="$PWD/target/zig-global-cache"
          export ZIG_LOCAL_CACHE_DIR="$PWD/target/zig-local-cache"
          (cd vendor/ghostty && zig build --fetch=all \
            -Demit-lib-vt=true -Demit-xcframework=false -Dapp-runtime=none)

      - name: Generate terminfo from the pinned source
        run: |
          set -euo pipefail
          export ZIG_GLOBAL_CACHE_DIR="$PWD/target/zig-global-cache"
          export ZIG_LOCAL_CACHE_DIR="$PWD/target/zig-local-cache"
          mkdir -p target/terminfo
          zig build-exe -lc -femit-bin=target/gen-terminfo \
            --dep ghostty_terminfo \
            -Mroot=scripts/gen-terminfo.zig \
            -Mghostty_terminfo=vendor/ghostty/src/terminfo/ghostty.zig
          ./target/gen-terminfo > target/ghostty.terminfo
          tic -x -o target/terminfo target/ghostty.terminfo
          infocmp -A target/terminfo xterm-ghostty > /dev/null

      - name: Offline locked gate
        run: |
          set -euo pipefail
          cargo fmt --all -- --check
          rustfmt --edition 2024 --check vendor/gpui/src/platform/key_text_scope.rs
          python3 -m unittest scripts.test_gpui_patch -v
          cargo clippy --workspace --all-targets --locked --offline -- -D warnings
          # `--no-fail-fast`: without it cargo stops at the first failing test
          # binary, so a run reports one failure and silently skips the rest of
          # the suite. That is how the suite stayed red across eight merges — the
          # 2026-09-05 run reached only 6 of 33 binaries, and each fix revealed
          # the next latent failure instead of the whole set at once.
          cargo test --workspace --locked --offline --no-fail-fast
          cargo build --workspace --locked --offline

      - name: Save Ghostty's Zig cache
        if: >-
          (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
          && steps.zig-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: target/zig-global-cache
          key: ${{ steps.zig-cache.outputs.cache-primary-key }}

      - name: Stress macOS under CPU load
        if: ${{ !cancelled() && inputs.stress }}
        env:
          SPRITE_TEST_WATCHDOG_SECS: "20"
        run: |
          set -uo pipefail
          command -v tmux >/dev/null || brew install tmux
          failed=0
          python3 scripts/stress_tests.py graphics_tmux --runs 100 --output "$RUNNER_TEMP/stress/graphics_tmux" || failed=1
          python3 scripts/stress_tests.py app --runs 30 --output "$RUNNER_TEMP/stress/app" || failed=1
          python3 scripts/stress_tests.py client --runs 3000 --output "$RUNNER_TEMP/stress/client" || failed=1
          exit "$failed"

      - name: Retain stress evidence
        if: ${{ always() && inputs.stress }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: stress-macos
          path: ${{ runner.temp }}/stress/

      - name: Bundle the debug binary and verify the result
        run: |
          set -euo pipefail
          # The gate's `cargo build --workspace` already produced this binary; a
          # release build here would double the job's time to prove a folder
          # layout. The bundle script does not care which profile it wraps.
          BINARY=target/debug/sprite packaging/macos/bundle.sh
          plutil -lint -s target/Sprite.app/Contents/Info.plist
          codesign --verify --deep --strict target/Sprite.app
          test -x target/Sprite.app/Contents/MacOS/sprite
          test -f target/Sprite.app/Contents/Resources/terminfo/78/xterm-ghostty
          target/Sprite.app/Contents/MacOS/sprite --version
