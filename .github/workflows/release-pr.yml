name: prepare release PR

on:
  workflow_dispatch:
    inputs:
      version:
        description: Stable release version without the v prefix (for example 0.2.1)
        required: true
        type: string

permissions:
  # actions: write starts CI on the release branch and clears the run that waits for approval.
  actions: write
  contents: write
  pull-requests: write

concurrency:
  group: release-pr-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  prepare:
    name: prepare and open release PR
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: master

      - name: Test release automation
        run: python3 -m unittest scripts.test_release_automation -v

      - name: Validate version and prepare release files
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if git ls-remote --exit-code --tags origin "refs/tags/v$VERSION" >/dev/null 2>&1; then
            echo "Release tag v$VERSION already exists" >&2
            exit 1
          fi
          python3 scripts/prepare_release.py "$VERSION"
          python3 scripts/check_release_version.py "v$VERSION"
          git diff --check
          if git diff --quiet; then
            echo "No release version changes were generated" >&2
            exit 1
          fi

      - name: Create release branch and pull request
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          release_branch="release/v$VERSION"
          if git ls-remote --exit-code --heads origin "$release_branch" >/dev/null 2>&1; then
            echo "Release branch $release_branch already exists; inspect or remove it before retrying" >&2
            exit 1
          fi
          git switch -c "$release_branch"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.toml Cargo.lock packaging/PKGBUILD README.md
          git commit -m "chore: prepare v$VERSION release"
          git push origin "$release_branch"
          gh pr create \
            --base master \
            --head "$release_branch" \
            --title "chore: prepare v$VERSION release" \
            --body "Updates the workspace, lockfile, Arch package recipe, and README package example to v$VERSION. CI was started on the release branch by the workflow that opened this PR. After merging, push the matching v$VERSION tag; CI verifies it against Cargo."

      # A pull request opened with this workflow's token gets CI runs that wait
      # for a person to approve them, and that end as failures when they expire
      # unapproved. CI is started here instead, where the token may start it:
      # its checks attach to the release commit, so the PR shows them.
      - name: Run CI on the release branch
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          release_branch="release/v$VERSION"
          gh workflow run ci.yml --ref "$release_branch"
          # The pull request's own run appears a moment after the PR. It is
          # removed rather than left to expire as a failure beside the real checks.
          for attempt in $(seq 1 12); do
            waiting=$(gh run list --branch "$release_branch" --event pull_request --status action_required \
              --json databaseId --jq '.[].databaseId')
            if [ -n "$waiting" ]; then
              for run in $waiting; do
                gh api -X DELETE "repos/$GITHUB_REPOSITORY/actions/runs/$run" \
                  && echo "removed run $run, which was waiting for approval" \
                  || echo "could not remove run $run; it can be approved or ignored" >&2
              done
              exit 0
            fi
            sleep 5
          done
          echo "no run waiting for approval was found"
