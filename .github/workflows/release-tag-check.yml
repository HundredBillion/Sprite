name: release tag version

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  verify-version:
    name: verify tag matches Cargo version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Check release tag against workspace version
        run: python3 scripts/check_release_version.py "$GITHUB_REF_NAME"
