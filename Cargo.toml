[workspace]
members = ["crates/sprite-app", "crates/sprite-pane", "crates/sprite-term"]
exclude = ["vendor/gpui"]
resolver = "3"

[workspace.package]
version = "0.9.1"
edition = "2024"
rust-version = "1.98.1"
license = "MIT OR Apache-2.0"

[workspace.lints.clippy]
let_underscore_must_use = "deny"
unwrap_used = "deny"
expect_used = "deny"
wildcard_enum_match_arm = "deny"
significant_drop_tightening = "deny"

[workspace.dependencies]
serde = { version = "=1.0.229", features = ["derive"] }
async-channel = "=2.5.0"
gpui = { version = "=0.2.2", default-features = false }
# From upstream libghostty-rs at an exact commit until a crates.io release is
# built against a Ghostty that supports Zig 0.17: this commit's bindings are
# generated for libghostty-vt 1.0.1, the commit vendor/ghostty is pinned to.
# `png` is deliberately not enabled: Sprite installs its own decoder through
# `set_png_decoder`, which is not gated on that feature, because the decoder
# enforces each pane's own storage limit (see `png_decoder.rs`).
libghostty-vt = { git = "https://github.com/Uzaaft/libghostty-rs", rev = "483ea3d5247b214060da58ef6037a95f30ae89fb", default-features = false, features = [
    "kitty-graphics",
] }
# `preserve_order` is Sprite's own choice, not a side effect of what gpui
# happens to enable: the Surface Channel promises `"type"` first on every
# event line, so a `json!` object must print in the order it was written.
serde_json = { version = "=1.0.151", features = ["preserve_order"] }
toml = { version = "=0.8.23", default-features = false, features = ["parse", "display"] }
png = { version = "=0.18.1", default-features = false }
# Only the pixel buffer types, to hand GPUI a texture. No codecs: Sprite
# decodes PNG itself and accepts no other image format.
image = { version = "=0.25.10", default-features = false }
nix = { version = "=0.28.0", default-features = false, features = ["fs", "poll", "process", "signal"] }
windows = { version = "=0.61.3", default-features = false }
portable-pty = { version = "=0.9.0", default-features = false }
sprite-pane = { path = "crates/sprite-pane" }
sprite-term = { path = "crates/sprite-term" }

# Link-time optimization across every crate and one codegen unit let the
# compiler drop and inline across crate boundaries; stripping removes the
# symbol table. Together they took the macOS binary from 20.8 MB to 14.0 MB,
# for about 45 s more per release build. Panic logs keep their file and line;
# only backtraces lose function names.
[profile.release]
lto = "fat"
codegen-units = 1
strip = "symbols"

[patch.crates-io]
gpui = { path = "vendor/gpui" }
